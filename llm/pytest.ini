[pytest]
# Pytest configuration for LLM tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    benchmark: performance benchmark tests that measure latency
    slow: tests that take a long time to run (load large models)

# Test paths
testpaths = llm

# Logging
log_cli = false
log_cli_level = INFO
