[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring models
    hardware: marks tests requiring actual audio hardware

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s - %(message)s
